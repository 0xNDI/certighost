[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certighost"
version = "0.1.0"
description = "CertiGhost - CVE-2026-54121 cdc-redirect chain PoC"
requires-python = ">=3.10"
dependencies = [
    "impacket",
    "asn1crypto",
    "cryptography",
    "pycryptodomex",
    "pyasn1",
    "dnspython",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
certighost = "certighost.cli:main"
